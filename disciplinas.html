    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #1c1917;
      --bg-card:   #231f1c;
      --border:    #2e2a27;
      --text:      #b8afa6;
      --text-dim:  #7d7167;
      --accent:    #d4913a;
      --accent-lt: #2e2a27;
      --heading:   #f0ebe4;
      --tag-bg:    #2e2a27;
      --tag-text:  #d4913a;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Georgia", "Times New Roman", serif;
      font-size: 16px;
      line-height: 1.75;
    }

    nav {
      background: #161412;
      border-bottom: 1px solid var(--border);
      padding: 0 2rem;
      display: flex;
      align-items: center;
      gap: 2rem;
      height: 52px;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    nav .site-name {
      font-family: "Helvetica Neue", Arial, sans-serif;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--heading);
      text-decoration: none;
      margin-right: auto;
    }
    nav a {
      font-family: "Helvetica Neue", Arial, sans-serif;
      font-size: 0.82rem;
      color: var(--text-dim);
      text-decoration: none;
      letter-spacing: 0.04em;
      transition: color 0.15s;
    }
    nav a:hover { color: var(--accent); }
    nav a.active { color: var(--accent); }

    .page { max-width: 960px; margin: 0 auto; padding: 2.5rem 1.5rem 6rem; }

    .page-header {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.8rem 2rem;
      margin-bottom: 2rem;
    }
    .page-header h1 {
      font-size: 1.4rem;
      font-weight: normal;
      color: var(--heading);
      margin-bottom: 0.4rem;
    }
    .page-header p {
      font-size: 0.95rem;
      color: var(--text-dim);
      font-style: italic;
    }

    h2 {
      font-family: "Helvetica Neue", Arial, sans-serif;
      font-size: 0.72rem;
      letter-spacing: 0.13em;
      text-transform: uppercase;
      color: var(--text-dim);
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.4rem;
      margin-bottom: 1.2rem;
      margin-top: 2.2rem;
    }

    .course-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.2rem;
      margin-bottom: 2rem;
    }

    .course-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.6rem;
      text-decoration: none;
      color: inherit;
      transition: border-color 0.15s, box-shadow 0.15s;
      cursor: pointer;
      display: flex;
      flex-direction: column;
    }

    .course-card:hover {
      border-color: var(--accent);
      box-shadow: 0 2px 8px rgba(212, 145, 58, 0.15);
    }

    .course-code {
      font-family: "Helvetica Neue", Arial, sans-serif;
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 0.4rem;
      font-weight: 600;
    }

    .course-name {
      font-size: 1.15rem;
      color: var(--heading);
      margin-bottom: 0.8rem;
      font-weight: normal;
    }

    .course-desc {
      font-size: 0.9rem;
      color: var(--text-dim);
      flex-grow: 1;
      margin-bottom: 0.8rem;
    }
