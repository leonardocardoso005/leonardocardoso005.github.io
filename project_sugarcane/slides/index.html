<!DOCTYPE html>
<html lang="en">

<meta name="mobile-web-app-capable" content="yes">

<title>Slides · Technical Change and Health · Leonardo C. B. Cardoso</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #000; overflow: hidden; touch-action: pan-y pinch-zoom;
               -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #slide { max-width: 100vw; max-height: 100vh; max-height: 100dvh; width: auto; height: auto; object-fit: contain; display: block; }
  #bar { position: fixed; left: 0; right: 0; bottom: 0; display: flex; align-items: center; justify-content: space-between;
         gap: .5rem; padding: .45rem .8rem calc(.45rem + env(safe-area-inset-bottom));
         font: 13px "Helvetica Neue", Arial, sans-serif; color: #b8afa6;
         background: linear-gradient(transparent, rgba(0,0,0,.75)); transition: opacity .4s; }
  #bar.hidden { opacity: 0; pointer-events: none; }
  #bar a, #bar button { color: #d4913a; background: none; border: 0; font: inherit; cursor: pointer; text-decoration: none; padding: .25rem .4rem; }
  #hint { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); padding: .7rem 1rem; border-radius: 8px;
          background: rgba(28,25,23,.9); color: #f0ebe4; font: 14px "Helvetica Neue", Arial, sans-serif; text-align: center;
          transition: opacity .6s; pointer-events: none; }
  #hint.gone { opacity: 0; }
</style>
</head>
<body>
<div id="stage"><img id="slide" alt="Slide"></div>
<div id="hint">Tap the right side or swipe to advance</div>
<div id="bar">
  <a href="../index.html">← Back</a>
  <span id="count"></span>
  <span>
    <button id="fs" type="button">Full screen</button>
    <a href="https://leonardocardoso005.github.io/papers/presentation-depal-tamu-sugarcane.pdf" target="_blank">PDF</a>
  </span>
</div>
<script>
  var N = 42, i = 1;
  var img = document.getElementById('slide'), count = document.getElementById('count'), bar = document.getElementById('bar');
  function src(k) { return 'img/s-' + (k < 10 ? '0' : '') + k + '.jpg'; }
  function show(k) {
    i = Math.max(1, Math.min(N, k));
    img.src = src(i); count.textContent = i + ' / ' + N;
    history.replaceState(null, '', '#' + i);
    [i + 1, i + 2, i - 1].forEach(function (j) { if (j >= 1 && j <= N) { var p = new Image(); p.src = src(j); } });
  }
  function fromHash() { var k = parseInt((location.hash || '#1').slice(1), 10); if (!isNaN(k) && k !== i) show(k); }
  var start = parseInt((location.hash || '#1').slice(1), 10); show(isNaN(start) ? 1 : start);
  window.addEventListener('hashchange', fromHash);
  // celular em pe: sugere girar a tela
  if (window.matchMedia('(orientation: portrait) and (max-width: 600px)').matches)
    document.getElementById('hint').textContent = 'Rotate your phone for larger slides. Tap or swipe to advance.';

  // barra some depois de alguns segundos; volta ao tocar
  var t; function poke() { bar.classList.remove('hidden'); clearTimeout(t); t = setTimeout(function () { bar.classList.add('hidden'); }, 3000); }
  poke();
  setTimeout(function () { document.getElementById('hint').classList.add('gone'); }, 2500);

  // toque: terco esquerdo volta, o resto avanca; deslizar: muda de slide
  var x0 = null, y0 = null, moved = false;
  document.getElementById('stage').addEventListener('touchstart', function (e) { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; moved = false; }, { passive: true });
  document.getElementById('stage').addEventListener('touchmove', function () { moved = true; }, { passive: true });
  document.getElementById('stage').addEventListener('touchend', function (e) {
    if (e.touches.length > 0 || x0 === null) return;
    var dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
    if (moved && Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) show(dx < 0 ? i + 1 : i - 1);
    else if (!moved) show(e.changedTouches[0].clientX < window.innerWidth / 3 ? i - 1 : i + 1);
    poke(); x0 = null; e.preventDefault();
  });
  document.getElementById('stage').addEventListener('click', function (e) { show(e.clientX < window.innerWidth / 3 ? i - 1 : i + 1); poke(); });
  document.addEventListener('keydown', function (e) {
    if (['ArrowRight', 'PageDown', ' ', 'Enter'].indexOf(e.key) >= 0) { show(i + 1); e.preventDefault(); }
    else if (['ArrowLeft', 'PageUp', 'Backspace'].indexOf(e.key) >= 0) { show(i - 1); e.preventDefault(); }
    else if (e.key === 'Home') show(1); else if (e.key === 'End') show(N); else if (e.key === 'f') toggleFs();
  });
  document.addEventListener('mousemove', poke);

  // tela cheia (onde o navegador permitir; no iPhone a pagina ja ocupa a tela toda)
  var root = document.documentElement, fsBtn = document.getElementById('fs');
  var canFs = root.requestFullscreen || root.webkitRequestFullscreen;
  if (!canFs) fsBtn.style.display = 'none';
  function toggleFs() {
    var on = document.fullscreenElement || document.webkitFullscreenElement;
    if (on) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    else (root.requestFullscreen || root.webkitRequestFullscreen).call(root);
  }
  fsBtn.addEventListener('click', function (e) { e.stopPropagation(); toggleFs(); });
</script>
</body>
</html>
